[project]
name = "cd-metadata"
version = "0.1.0"
description = "Generate ripped-CD metadata from a webpage URL using a local LM Studio model."
requires-python = ">=3.10"
dependencies = [
    "lmstudio>=1.0",
    "pydantic>=2.0",
    "mutagen>=1.47",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["."]

[tool.coverage.run]
source = ["cd_metadata"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
